<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="disc" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2b2b31"/>
      <stop offset="0.65" stop-color="#141417"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="label" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ff5470"/>
      <stop offset="1" stop-color="#e6002e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d5e"/>
      <stop offset="1" stop-color="#ff0033"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- The record -->
  <circle cx="256" cy="256" r="212" fill="url(#disc)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3">
    <circle cx="256" cy="256" r="188"/>
    <circle cx="256" cy="256" r="166"/>
    <circle cx="256" cy="256" r="144"/>
  </g>
  <circle cx="256" cy="256" r="212" fill="url(#sheen)"/>
  <!-- How far the song has come -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="26"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="1038 445" transform="rotate(-90 256 256)"/>
  <!-- The label and the play mark -->
  <circle cx="256" cy="256" r="112" fill="url(#label)"/>
  <path d="M233 207 L302 256 L233 305 Z" fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
</svg>
